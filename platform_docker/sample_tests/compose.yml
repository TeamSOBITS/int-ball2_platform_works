services:
  user_debug:
    image: ib2_user:0.1
    container_name: user_debug_container
    network_mode: host
    ipc: host
    privileged: true
    stop_grace_period: 1s
    environment:
      - DISPLAY=${DISPLAY}
      - ROS_MASTER_URI=http://localhost:11311
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    # --- ここから追加 ---
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # --- ここまで追加 ---
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    tty: true
    stdin_open: true